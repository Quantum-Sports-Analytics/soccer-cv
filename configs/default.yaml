# Default pipeline configuration. Every stage reads only its own block.
# The hash of this file (minus `runtime`) is part of every cache key.

runtime:
  device: auto            # auto | cpu | cuda
  fp16: true
  num_workers: 4

ingest:                   # stage 0
  hist_cut_threshold: 0.35        # HSV-histogram L1 distance that declares a cut
  min_shot_frames: 12
  classify_every_n: 5
  normalize: true          # re-encode to the working profile when needed (height <= max_height, constant fps)
  max_height: 1080
  target_fps: 25

detect:                   # stage 3
  model: rfdetr-medium    # rfdetr-nano | rfdetr-small | rfdetr-medium | rfdetr-large
  resolution: 960
  score_threshold: 0.35
  tiles: adaptive         # none | adaptive
  person_min_height_px: 14

calib:                    # stages 1-2 — white-line mask + parametric broadcast camera fit (no learned model)
  enabled: true
  every_n_frames: 25      # keyframes at 1 Hz; camera parameters interpolated in between
  max_err_px: 3.5         # mean px distance of matched model points (fit precision)
  min_coverage: 0.30      # fraction of in-view pitch model within 4 px of a detected line
  min_explained: 0.30     # fraction of detected line pixels within 4 px of the projected model
  anchor_candidates: 3    # keyframes fitted from scratch; the best one seeds propagation
  topk: 60                # grid seeds refined locally in a from-scratch fit
  refit_every_keyframes: 10
  motion_interp: true      # camera motion between keyframes from background features (TV graphics excluded)
  motion_tol_deg: 1.0     # keyframe dropped/refit if the motion contradicts it from both sides by more than this

track:                    # stage 4
  max_age: 30             # frames a track survives without a detection
  min_hits: 3
  iou_threshold: 0.25
  eiou_expansion: 0.3     # Deep-EIoU style expansion of boxes before IoU
  appearance_weight: 0.35
  occlusion_correct: true # OA-SORT style positional-cost correction
  cmc: conditional        # off | conditional | always
  margin_low: 0.15        # assignment margin below which a window is "ambiguous"
  team_gate: true         # forbid associating a track to a confident other-team detection
  team_ratio: 0.7         # detection is "confidently team i" if d_i < ratio * d_j
  team_refit_every: 100   # frames between refits of the online team model
  pitch_filter: true      # reject detections whose feet are off the pitch (calibrated polygon, else grass mask)
  pitch_margin_m: 1.0     # keep a person iff feet within the lines + this margin (metres); nobody off the pitch is tracked

reid:                     # stage 5 — OSNet-AIN embeddings + ambiguous-crossing resolution
  enabled: true
  every_n_frames: 5
  torso_crop: [0.15, 0.55]   # vertical fraction of the box used for team colour
  swap_window_frames: 100    # evidence window on each side of an ambiguous crossing
  swap_margin: 1.5           # decision margin in nats (best vs runner-up assignment); below -> split + low confidence
  swap_motion_weight: 0.03   # appearance scale: a ReID cosine gap of this size = 1 nat; motion enters as a reachability log-likelihood

mask_tier:                # stage 6 (quality tier) — off until SAM3 is wired
  enabled: false
  margin_trigger: 0.15

ball:                     # stage 7
  score_threshold: 0.20
  max_speed_px_per_frame: 90
  max_gap_frames: 20

identity:                 # stages 8-10
  staff_min_beyond_frac: 0.7   # safety net: track removed if >= this fraction of its frames is beyond the lines
  team_clusters: 2
  max_per_team: 11
  link_max_gap_frames: 750      # 30 s at 25 fps
  link_appearance_threshold: 0.45
  abstain_below: 0.55           # CSIS-style: report unknown below this belief
  split_link_margin: 0.03        # min gap (sum of ReID cosines) between best and runner-up joint assignment of a split group

ball3d:                   # stage 11
  enabled: false

render:                   # stage 13
  show_confidence: true
  show_reentry_flags: true
  show_roster_panel: true
  show_pitch_grid: true
