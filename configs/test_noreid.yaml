runtime:
  device: auto
  fp16: true
  num_workers: 4
ingest:
  hist_cut_threshold: 0.35
  min_shot_frames: 12
  classify_every_n: 5
detect:
  model: rfdetr-medium
  resolution: 960
  score_threshold: 0.35
  tiles: adaptive
  person_min_height_px: 14
calib:
  enabled: false
  every_n_frames: 25
  max_err_px: 3.5
  min_coverage: 0.3
  min_explained: 0.3
  anchor_candidates: 3
  topk: 60
  refit_every_keyframes: 10
track:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.25
  eiou_expansion: 0.3
  appearance_weight: 0.35
  occlusion_correct: true
  cmc: conditional
  margin_low: 0.15
  team_gate: true
  team_ratio: 0.7
  team_refit_every: 100
  pitch_filter: true
  pitch_margin_m: 1.0
reid:
  enabled: false
  every_n_frames: 5
  torso_crop:
  - 0.15
  - 0.55
  swap_window_frames: 100
  swap_margin: 1.5
  swap_motion_weight: 0.03
mask_tier:
  enabled: false
  margin_trigger: 0.15
ball:
  score_threshold: 0.2
  max_speed_px_per_frame: 90
  max_gap_frames: 20
identity:
  team_clusters: 2
  max_per_team: 11
  link_max_gap_frames: 750
  link_appearance_threshold: 0.45
  abstain_below: 0.55
  split_link_margin: 0.03
ball3d:
  enabled: false
render:
  show_confidence: true
  show_reentry_flags: true
  show_roster_panel: true
  show_pitch_grid: true
